# GitHub Actions — Deploy staging.vlist.io
# Triggers on push to the next branch (the 3.0 line), manual trigger, or when vlist next is updated.
# This file must stay identical on staging, the default branch: repository_dispatch runs its copy.
# SSHs into the server and runs deploy commands for the staging instance

name: Deploy Staging

on:
  push:
    branches: [next]

  # Triggered by vlist repo when its next branch (the 3.0 prerelease line) is updated
  repository_dispatch:
    types: [vlist-staging-updated]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Serialize deploys. A push to vlist.io next and a repository_dispatch from
# vlist next can fire near-simultaneously; running both at once makes the
# server-side `git fetch` collide on the origin/staging ref lock. Queue instead
# of cancelling — an in-flight SSH deploy must not be aborted mid-run.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging.vlist.io
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # Set up PATH explicitly (avoid sourcing .zshrc — it fails
            # in non-interactive SSH sessions due to prompt/completion setup)
            export PATH="$HOME/.bun/bin:$HOME/bin:$HOME/.local/share/fnm:$PATH"
            eval "$(fnm env)"

            APP_DIR="/home/floor/staging.vlist.io"

            echo "📦 Deploying staging.vlist.io..."

            # Pull latest vlist next branch, the 3.0 prerelease line (separate clone;
            # production installs vlist from npm latest)
            VLIST_DIR="/home/floor/staging.vlist"
            cd $VLIST_DIR
            git fetch origin next
            git checkout -f -B next origin/next
            bun install --frozen-lockfile
            bun run build

            # Pull latest vlist.io next branch (the 3.0 line; staging stays the 2.x line for production)
            cd $APP_DIR
            git fetch origin next
            git checkout -f -B next origin/next

            # Point vlist dependency to the local clone (not npm — we want the latest next code)
            echo "🔗 Linking vlist from staging clone..."
            sed -i 's|"vlist": "file:../vlist"|"vlist": "file:../staging.vlist"|' package.json

            # Clean install to ensure fresh resolution (avoid lockfile conflicts)
            rm -rf node_modules bun.lock
            bun install --force

            # Framework adapters (vlist-react, vlist-vue, etc.) depend on @floor/vlist
            # but the local file: link installs as "vlist". Create the @floor/vlist symlink
            # so adapter packages can resolve it.
            mkdir -p node_modules/@floor
            ln -sfn ../vlist node_modules/@floor/vlist

            # Build sandbox examples and benchmarks (using the latest vlist next code).
            # The benchmark bundler resolves vlist from VLIST_BENCH_ROOT (default ../vlist,
            # the production clone), so point it at the staging clone explicitly.
            bun run build:examples
            VLIST_BENCH_ROOT="$VLIST_DIR" bun run build:bench

            # Restore package.json (keep git clean for next pull)
            git checkout -- package.json

            # Restart PM2 staging process
            pm2 reload staging.vlist.io --update-env || pm2 start ecosystem.staging.config.cjs

            echo "✅ Staging deployed successfully"

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "🧹 Cloudflare cache purged"
