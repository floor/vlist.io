name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Checkout sibling vlist
        run: |
          git init ../vlist
          git -C ../vlist remote add origin "https://github.com/floor/vlist.git"
          git -C ../vlist fetch --tags --depth=1 origin main
          git -C ../vlist checkout --detach FETCH_HEAD
          git -C ../vlist log -1 --oneline

      - name: Build sibling vlist
        run: |
          cd ../vlist
          bun install --frozen-lockfile
          bun run build

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build examples
        run: bun run build:examples

      - name: Build benchmarks
        run: bun run build:bench

      # These suites run without the optional local API datasets.
      - name: Unit tests
        run: bun test --max-concurrency=1 ./test/server ./test/benchmarks ./test/scripts ./test/workflows ./test/synthetic-experiment.test.ts

      - name: Unit tests (concurrent)
        run: bun test --concurrent ./test/server ./test/benchmarks ./test/scripts ./test/workflows ./test/synthetic-experiment.test.ts

      - name: Test (production cache)
        run: NODE_ENV=production bun test ./test/server/cache.test.ts
