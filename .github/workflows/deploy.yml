# GitHub Actions — Deploy vlist.io to floor.io
# Triggers on push to main branch, on a vlist release, or by hand.
# This file must stay identical on staging, the default branch: repository_dispatch runs its copy.
# SSHs into the server and runs deploy commands
# After deploy, purges Cloudflare edge cache so users get fresh content

name: Deploy

on:
  push:
    branches: [main]

  # Sent by vlist's publish workflow after a stable release is on npm, with
  # the tag in client_payload.version. Without it, production kept serving
  # the version installed at its last push or manual run.
  repository_dispatch:
    types: [vlist-released]

  # Allow manual trigger from Actions tab
  workflow_dispatch:

# A vlist release and a vlist.io push can fire close together. Queue instead
# of cancelling: an in-flight SSH deploy must not be aborted mid-run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to floor.io
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      # The version is interpolated into the server's shell, so only a plain
      # semver gets through. Empty (a push or a manual run) means npm latest.
      - name: Check the requested version
        id: version
        env:
          REQUESTED: ${{ github.event.client_payload.version }}
        run: |
          version="${REQUESTED#v}"
          if [ -n "$version" ] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a plain semver: $REQUESTED"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          VLIST_VERSION: ${{ steps.version.outputs.version }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: VLIST_VERSION
          command_timeout: 16m
          script: |
            set -e

            # Set up PATH explicitly (avoid sourcing .zshrc — it fails
            # in non-interactive SSH sessions due to prompt/completion setup)
            export PATH="$HOME/.bun/bin:$HOME/bin:$HOME/.local/share/fnm:$PATH"
            eval "$(fnm env)"

            APP_DIR="/home/floor/vlist.io"

            echo "📦 Deploying vlist.io..."

            # Pull the released vlist (used by file browser API + staleness check).
            # main is the released line; staging is the frozen 2.x maintenance branch.
            VLIST_DIR="/home/floor/vlist"
            cd $VLIST_DIR
            git fetch origin main
            git reset --hard origin/main
            bun install --frozen-lockfile
            bun run build

            # A release dispatch names its version. The registry serves a fresh
            # publish minutes late, so wait for it rather than install the
            # previous one. A push or a manual run takes npm latest, as before.
            # Wait on the abbreviated manifest — the view bun install resolves
            # from. It can lag the full manifest `npm view` reads: on 3.3.1,
            # npm view saw the version and bun install still did not.
            VLIST_SPEC="latest"
            if [ -n "$VLIST_VERSION" ]; then
              VLIST_SPEC="$VLIST_VERSION"
              for attempt in $(seq 1 60); do
                if curl -sf -H "Accept: application/vnd.npm.install-v1+json" https://registry.npmjs.org/vlist | grep -qF "\"$VLIST_VERSION\""; then
                  break
                fi
                if [ "$attempt" = 60 ]; then
                  echo "❌ npm does not serve vlist@$VLIST_VERSION after 10 minutes"
                  exit 1
                fi
                sleep 10
              done
            fi

            # Pull latest vlist.io
            cd $APP_DIR
            git fetch origin main
            git reset --hard origin/main

            # Replace file: dependencies with npm registry versions BEFORE building
            # (file: paths are for local dev only — they don't exist on the server)
            echo "🔗 Resolving production dependencies (vlist@$VLIST_SPEC)..."
            sed -i "s|\"vlist\": \"file:../vlist\"|\"vlist\": \"$VLIST_SPEC\"|" package.json

            # Clean install to ensure fresh resolution (avoid lockfile conflicts).
            # The registry can still lag after the wait, so retry with a bounded
            # backoff (10 s, 20 s, … 50 s: about 2.5 minutes over six tries),
            # bypassing bun's manifest cache, then fail rather than build on
            # the previous version.
            #
            # A failed install must not leave the live site without its modules:
            # 3.3.1's deploy deleted node_modules and then failed, and the pm2
            # process kept serving /dist/* from a directory that no longer
            # existed. Move the current modules aside instead of deleting them,
            # and put them back if every install attempt fails.
            # A run killed between the move and the restore leaves the last
            # good tree in node_modules.prev. Keep it until an install
            # succeeds; the partial tree the killed run left is installed
            # over, and a failure below still restores the aside copy.
            if [ ! -d node_modules.prev ] && [ -d node_modules ]; then
              mv node_modules node_modules.prev
            fi
            if [ -f bun.lockb ]; then
              mv bun.lockb bun.lockb.prev
            fi
            install_ok=0
            for try in $(seq 1 6); do
              if bun install --force --no-cache; then
                install_ok=1
                break
              fi
              if [ "$try" != 6 ]; then
                sleep $((try * 10))
              fi
            done
            if [ "$install_ok" != 1 ]; then
              echo "❌ bun install could not resolve vlist@$VLIST_SPEC after 6 attempts"
              # Roll back: drop the partial tree the failed install may have
              # written, then put the modules the live process was serving
              # from back where it expects them, and restore package.json.
              rm -rf node_modules
              if [ -d node_modules.prev ]; then
                mv node_modules.prev node_modules
              fi
              if [ -f bun.lockb.prev ]; then
                mv bun.lockb.prev bun.lockb
              fi
              git checkout -- package.json
              exit 1
            fi
            rm -rf node_modules.prev
            rm -f bun.lockb.prev

            # Build sandbox examples and benchmarks (now that vlist is installed from npm)
            bun run build:examples
            bun run build:bench

            # Restore package.json (keep git clean for next pull)
            git checkout -- package.json

            # Restart PM2 process
            pm2 reload vlist.io --update-env || pm2 start ecosystem.config.cjs

            echo "✅ Deployed successfully"

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "🧹 Cloudflare cache purged"

      # The site shows the version of the vlist it serves (dist/version.json of
      # the installed package). A deploy that left it behind fails here instead
      # of reporting success.
      - name: Verify the live version
        env:
          REQUESTED: ${{ steps.version.outputs.version }}
        run: |
          expected="${REQUESTED:-$(npm view vlist version)}"
          for attempt in $(seq 1 12); do
            if curl -sf https://vlist.io | grep -qF "v$expected"; then
              echo "✅ vlist.io serves vlist $expected"
              exit 0
            fi
            sleep 10
          done
          echo "::error::vlist.io does not show v$expected two minutes after the deploy"
          exit 1
